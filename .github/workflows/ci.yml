name: LinguaFox CI

on:
  pull_request:
    branches:
      - feat/linguafox-app
  push:
    branches:
      - feat/linguafox-app

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript and Vite build
        run: npm run build
